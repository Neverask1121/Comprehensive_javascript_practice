<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigga Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!--top section-->
    <div class="intro py-3 bg-white text-center">
        <div class="container">
            <h2 class="text-primary display-3 my-4">
                Nigga Quiz
            </h2>
        </div>
    </div>



    
    <!--Result section-->
    <div class="result py-3 bg-white text-center">
        <div class="container">
            <p>You are <span class="text-primary display-4 p-3">0%</span> Nigga</p>
        </div>
    </div>



    <!--Quiz section-->
    <div class="quiz py-4 bg-primary">
        <div class="container">
            <h2 class="my-5 text-white">
                The questions of the nigeshwar land is here.
            </h2>
            <form class="quiz-form text-light">
                <div class="my-5">
                    <p class="lead font-weight-normal">
                        1. What is the color of Nigga?
                    </p>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q1" value = "A" checked>
                        <label class="form-check-label">
                            Black
                        </label>
                    </div>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q1" value = "B" checked>
                        <label class="form-check-label">
                            White
                        </label>
                    </div>
                </div>
                <div class="my-5">
                    <p class="lead font-weight-normal">
                        2. What is the taste of Nigga?
                    </p>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q2" value = "A" checked>
                        <label class="form-check-label">
                            Sour
                        </label>
                    </div>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q2" value = "B" checked>
                        <label class="form-check-label">
                            Sweet
                        </label>
                    </div>
                </div>
                <div class="my-5">
                    <p class="lead font-weight-normal">
                        3. What is the gender of Nigga?
                    </p>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q3" value = "A" checked>
                        <label class="form-check-label">
                            Male
                        </label>
                    </div>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q3" value = "B" checked>
                        <label class="form-check-label">
                            Female
                        </label>
                    </div>
                <div class="my-5">
                    <p class="lead font-weight-normal">
                        4. What is the country of Nigga?
                    </p>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q4" value = "A" checked>
                        <label class="form-check-label">
                            Pakistan
                        </label>
                    </div>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q4" value = "B" checked>
                        <label class="form-check-label">
                            Bangladesh
                        </label>
                    </div>                <div class="my-5">
                    <p class="lead font-weight-normal">
                        5. What is the puh of Nigga?
                    </p>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q5" value = "A" checked>
                        <label class="form-check-label">
                            Pink puh
                        </label>
                    </div>
                    <div class="form-check my-2 text-white-50">
                        <input type="radio" name = "q5" value = "B" checked>
                        <label class="form-check-label">
                            Black puh
                        </label>
                    </div>
                </div>
                <div class="text-center">
                    <input type="submit" class = "btn btn-light">
                </div>
            </form>
        </div>
    </div>

    <script src = "app.js"></script>
</body>
</html>
